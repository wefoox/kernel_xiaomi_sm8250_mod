name: Build AK3 Kernel Package

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Target device (目标设备)'
        required: true
        type: choice
        options:
          - 'umi'
          - 'cmi'
          - 'cas'
          - 'thyme'
          - 'munch'
          - 'dagu'
          - 'elish'
          - 'enuma'
          - 'alioth'
          - 'apollo'
          - 'lmi'
          - 'psyche'
          - 'pipa'
      kernelsu_enabled:
        description: 'Enable KernelSU (是否启用 KernelSU)'
        required: true
        type: choice
        default: 'Yes'
        options:
          - 'Yes'
          - 'No'
      compiled_system:
        description: 'Compiled system type (适用系统类型)'
        required: true
        type: choice
        default: 'MIUI'
        options:
          - 'MIUI'
          - 'AOSP'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Setting up build environment
        run: |
          sudo apt update && sudo apt install -y \
            build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3

      - name: 📥 Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: $HOME/proton-clang
          key: toolchain-proton-clang
          restore-keys: |
            toolchain-

      - name: 📥 Download Proton Clang toolchain (if needed)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p $HOME/proton-clang
          cd $HOME/proton-clang
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip 20210522.zip
          cd ~

      - name: 🔍 Verify Proton Clang toolchain
        run: |
          if [ ! -d "$HOME/proton-clang/proton-clang-20210522/bin" ]; then
            echo "❌ Proton Clang toolchain path does not exist."
            ls -l $HOME/proton-clang
            exit 1
          else
            echo "✅ Proton Clang toolchain verified successfully."
          fi

      - name: 📥 Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: weekdaycare/kernel_xiaomi_sm8250_mod
          path: kernel_source

      - name: 🔨 Build kernel
        run: |
          cd kernel_source
          chmod +x build.sh
          TARGET_DEVICE="${{ github.event.inputs.target_device }}"
          KERNELSU_ENABLED="${{ github.event.inputs.kernelsu_enabled }}"
          if [ "$KERNELSU_ENABLED" == "Yes" ]; then
            TOOLCHAIN_PATH=$HOME/proton-clang/proton-clang-20210522/bin bash build.sh $TARGET_DEVICE ksu
          else
            TOOLCHAIN_PATH=$HOME/proton-clang/proton-clang-20210522/bin bash build.sh $TARGET_DEVICE
          fi
          echo "✅ Kernel build complete."

      - name: 📦 Package kernel into AnyKernel3
        run: |
          cd kernel_source
          OUTPUT_ZIP=$(ls *.zip | grep "${{ github.event.inputs.target_device }}")
          echo "Packaging kernel into AnyKernel3..."
          echo "Generated package: $OUTPUT_ZIP"

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: AK3-Kernel-${{ github.event.inputs.target_device }}
          path: kernel_source/*.zip
