name: Build AK3 Kernel

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Target device code (e.g., lmi, umi)'
        required: true
        default: 'pipa'
      enable_kernelsu:
        description: 'Enable KernelSU (yes/no)'
        required: true
        default: 'yes'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3

      - name: Set up toolchain
        run: |
          mkdir -p $HOME/proton-clang
          cd $HOME/proton-clang
          wget https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip 20210522.zip
          cd ..

      - name: Build Kernel
        run: |
          bash build.sh ${{ github.event.inputs.target_device }} ${{ github.event.inputs.enable_kernelsu }}

      - name: Archive artifacts
        uses: actions/upload-artifact@v3
        with:
          name: kernel-${{ github.event.inputs.target_device }}
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/dtb
            anykernel/*.zip

      - name: Clean up
        run: |
          rm -rf out/
          rm -rf anykernel/
          echo "Clean up done."
