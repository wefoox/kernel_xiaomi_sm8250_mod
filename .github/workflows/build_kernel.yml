name: Build AK3 Kernel Package

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Target device (目标设备)'
        required: true
        type: choice
        options:
          - 'umi'
          - 'cmi'
          - 'cas'
          - 'thyme'
          - 'munch'
          - 'dagu'
          - 'elish'
          - 'enuma'
          - 'alioth'
          - 'apollo'
          - 'lmi'
          - 'psyche'
          - 'pipa'
      kernelsu_enabled:
        description: 'Enable KernelSU (是否启用 KernelSU)'
        required: true
        type: choice
        default: 'Yes'
        options:
          - 'Yes'
          - 'No'
      compiled_system:
        description: 'Compiled system type (适用系统类型)'
        required: true
        type: choice
        default: 'MIUI'
        options:
          - 'MIUI'
          - 'AOSP'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      cache-hit-toolchain: ${{ steps.cache-toolchain.outputs.cache-hit }}
    steps:
      - name: 📦 Setting up build environment
        run: |
          echo "Setting up build environment..."
          sudo apt update && sudo apt install -y \
            build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3
          echo "✅ Build environment setup complete."

      - name: 📥 Restore ccache
        uses: actions/cache@v3
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.event.inputs.target_device }}-${{ github.event.inputs.compiled_system }}
          restore-keys: |
            ccache-${{ github.event.inputs.target_device }}-
            ccache-

      - name: ⚙️ Configure ccache
        run: |
          mkdir -p ~/.cache/ccache
          ccache --max-size=5G
          ccache --set-config=compression=true
          ccache --zero-stats
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> $GITHUB_ENV

      - name: 📥 Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v3
        with:
          path: $HOME/proton-clang
          key: toolchain-proton-clang
          restore-keys: |
            toolchain-

      - name: 📥 Download Proton Clang toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Proton Clang toolchain..."
          mkdir -p $HOME/proton-clang
          cd $HOME/proton-clang
          wget -q https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip 20210522.zip
          mv proton-clang-20210522/* .
          echo "✅ Proton Clang toolchain download complete."

  build:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN_PATH: $HOME/proton-clang/bin

    steps:
      - name: 📥 Checkout kernel source
        uses: actions/checkout@v3
        with:
          repository: yspbwx2010/kernel_xiaomi_sm8250_mod
          path: kernel_source

      - name: 🔨 Build kernel
        run: |
          cd kernel_source
          chmod +x build.sh
          
          TARGET_DEVICE="${{ github.event.inputs.target_device }}"
          KERNELSU_ENABLED="${{ github.event.inputs.kernelsu_enabled }}"
          SYSTEM="${{ github.event.inputs.compiled_system }}"
          
          if [ "$KERNELSU_ENABLED" == "Yes" ]; then
            bash build.sh $TARGET_DEVICE ksu
          else
            bash build.sh $TARGET_DEVICE
          fi
          
          echo "✅ Kernel build complete."

      - name: 📦 Package kernel into AnyKernel3
        run: |
          cd kernel_source
          OUTPUT_ZIP=$(ls *.zip | grep "$TARGET_DEVICE")
          echo "Packaging kernel into AnyKernel3..."
          echo "Generated package: $OUTPUT_ZIP"
          echo "✅ Packaging complete."

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AK3-Kernel-${{ github.event.inputs.target_device }}
          path: kernel_source/*.zip

      - name: 📊 Save ccache statistics
        run: |
          echo "📊 CCache Statistics:"
          ccache --show-stats

      - name: 📥 Save ccache
        uses: actions/cache@v3
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.event.inputs.target_device }}-${{ github.event.inputs.compiled_system }}
          restore-keys: |
            ccache-${{ github.event.inputs.target_device }}-
            ccache-
