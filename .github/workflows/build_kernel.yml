name: Build AK3 Kernel Package

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Target device (目标设备)'
        required: true
        type: choice
        options:
          - 'umi'
          - 'cmi'
          - 'cas'
          - 'thyme'
          - 'munch'
          - 'dagu'
          - 'elish'
          - 'enuma'
          - 'alioth'
          - 'apollo'
          - 'lmi'
          - 'psyche'
          - 'pipa'
      kernelsu_enabled:
        description: 'Enable KernelSU (是否启用 KernelSU)'
        required: true
        type: choice
        default: 'Yes'
        options:
          - 'Yes'
          - 'No'
      compiled_system:
        description: 'Compiled system type (适用系统类型)'
        required: true
        type: choice
        default: 'MIUI'
        options:
          - 'MIUI'
          - 'AOSP'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Setting up build environment
        run: |
          sudo apt update && sudo apt install -y \
            build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3

      - name: ♻️ Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache_mikernel
          key: ccache-${{ github.event.inputs.target_device }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.event.inputs.target_device }}-
            ccache-

      - name: 🧮 Show ccache stats (before build)
        run: ccache -s || true

      - name: 📥 Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: $HOME/proton-clang
          key: toolchain-proton-clang
          restore-keys: |
            toolchain-

      - name: 📥 Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: wefoox/kernel_xiaomi_sm8250_mod
          path: kernel_source

      - name: 🔨 Build kernel
        run: |
          cd kernel_source
          chmod +x build.sh
          export TOOLCHAIN_PATH=$HOME/proton-clang/proton-clang-20210522/bin
          TARGET_DEVICE="${{ github.event.inputs.target_device }}"
          KERNELSU_ENABLED="${{ github.event.inputs.kernelsu_enabled }}"
          if [ "$KERNELSU_ENABLED" == "Yes" ]; then
            bash build.sh $TARGET_DEVICE ksu
          else
            bash build.sh $TARGET_DEVICE
          fi

      - name: 📦 Package kernel into AnyKernel3
        run: |
          cd kernel_source
          OUTPUT_ZIP=$(ls *.zip | grep "${{ github.event.inputs.target_device }}")
          echo "Packaging kernel into AnyKernel3..."
          echo "Generated package: $OUTPUT_ZIP"

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AK3-Kernel-${{ github.event.inputs.target_device }}
          path: kernel_source/*.zip
          
      - name: 🧮 Show ccache stats (after build)
        run: ccache -s || true
