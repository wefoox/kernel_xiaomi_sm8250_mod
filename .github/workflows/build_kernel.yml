name: Build AK3 Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target device (如: umi, lmi, cmi, all)'
        required: true
        default: 'pipa'
        type: choice
        options:
          - umi
          - lmi
          - cmi
          - pipa
          - all
      system:
        description: '系统类型 (AOSP or MIUI)'
        required: true
        default: 'MIUI'
        type: choice
        options:
          - AOSP
          - MIUI
      kernelsu:
        description: '是否启用 KernelSU'
        required: true
        default: 'off'
        type: choice
        options:
          - off
          - on

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        device: ${{ fromJson(github.event.inputs.device == 'all' && '["umi","lmi","cmi"]' || '["' + github.event.inputs.device + '"]') }}
    env:
      TOOLCHAIN_DIR: ${{ github.workspace }}/proton-clang/proton-clang-20210522/bin
      CCACHE_DIR: ${{ github.workspace }}/.cache/ccache_mikernel
      BUILD_DIR: ${{ github.workspace }}
      KERNELSU_ARG: ${{ github.event.inputs.kernelsu == 'on' && 'ksu' || '' }}
      SYSTEM_ARG: ${{ github.event.inputs.system }}
      DEVICE: ${{ matrix.device }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 tree

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .cache/ccache_mikernel
          key: ccache-${{ env.DEVICE }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.DEVICE }}-
            ccache-

      - name: Download proton-clang toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: proton-clang
          key: proton-clang-20210522
      - name: Fetch proton-clang if not cached
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p proton-clang
          cd proton-clang
          wget https://github.com/kdrag0n/proton-clang/archive/refs/tags/20210522.zip
          unzip 20210522.zip
          mv proton-clang-20210522 proton-clang-20210522
          ls proton-clang-20210522/bin
          cd ..

      - name: Show toolchain version
        run: |
          ${{ env.TOOLCHAIN_DIR }}/clang --version

      - name: Build kernel for ${{ env.DEVICE }}
        run: |
          chmod +x build.sh
          echo "::group::Build log"
          bash build.sh $DEVICE $KERNELSU_ARG | tee build_${DEVICE}.log
          echo "::endgroup::"

      - name: Find built zips
        id: find-zip
        run: |
          ls -lh ./*.zip || true

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: AK3-Kernel-${{ env.DEVICE }}-${{ github.event.inputs.system }}${{ github.event.inputs.kernelsu == 'on' && '-KernelSU' || '' }
          path: ./*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out

      - name: Prepare release files
        run: |
          mkdir -p release
          find out -name '*.zip' -exec mv {} release/ \;
          echo "RELEASE_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.zip
          name: AK3-Kernel-${{ github.event.inputs.device }}-${{ github.event.inputs.system }}-${{ github.event.inputs.kernelsu == 'on' && 'KernelSU-' || '' }}${{ env.RELEASE_DATE }}
          tag_name: AK3-Kernel-${{ github.event.inputs.device }}-${{ github.event.inputs.system }}-${{ github.event.inputs.kernelsu == 'on' && 'KernelSU-' || '' }}${{ env.RELEASE_DATE }}
          body: |
            # AK3 Kernel Build
            - **Device:** ${{ github.event.inputs.device }}
            - **System:** ${{ github.event.inputs.system }}
            - **KernelSU:** ${{ github.event.inputs.kernelsu }}
            - **Build Date:** ${{ env.RELEASE_DATE }}
            - **Build Log:** See Actions run for details.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
